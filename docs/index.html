<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Connector Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #6b7280;
    --border: #e3e6ea;
    --green: #1a9c5b;
    --green-bg: #e7f6ee;
    --red: #d1343b;
    --red-bg: #fbe9ea;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1114;
      --card: #1a1d21;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #2a2e34;
      --green: #3ecf8e;
      --green-bg: #10251c;
      --red: #ff6b70;
      --red-bg: #2a1416;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .updated { color: var(--muted); font-size: 13px; }
  .score {
    display: flex; gap: 10px; margin: 20px 0 8px; flex-wrap: wrap;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 13px;
    border: 1px solid var(--border); background: var(--card);
  }
  .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .dot.green { background: var(--green); }
  .dot.red { background: var(--red); }
  .bar { height: 8px; border-radius: 4px; background: var(--red);
         overflow: hidden; margin: 4px 0 24px; border: 1px solid var(--border); }
  .bar > span { display: block; height: 100%; background: var(--green); }
  .spark { margin: 0 0 28px; }
  .spark svg { width: 100%; height: 40px; display: block; }
  .spark .lbl { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  section { margin-bottom: 22px; }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 10px; font-weight: 700;
  }
  .grid { display: grid; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px; box-shadow: var(--shadow);
  }
  .sq { font-size: 15px; line-height: 1; flex: none; }
  .row .name { font-weight: 600; }
  .row .note { color: var(--muted); font-size: 13px; margin-left: auto;
               text-align: right; }
  .row.intentional { opacity: .55; }
  .row.intentional .name { font-weight: 500; }
  footer { color: var(--muted); font-size: 12px; margin-top: 40px;
           border-top: 1px solid var(--border); padding-top: 16px; }
  code { background: var(--border); padding: 1px 5px; border-radius: 4px;
         font-size: 12px; }
  .err { color: var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Connector Dashboard</h1>
    <span class="updated" id="updated"></span>
  </header>

  <div class="score" id="score"></div>
  <div class="bar" id="bar"><span></span></div>

  <div class="spark" id="spark" hidden>
    <div class="lbl">green count &mdash; last runs</div>
    <svg id="sparksvg" viewBox="0 0 300 40" preserveAspectRatio="none"></svg>
  </div>

  <div id="groups"></div>

  <footer>
    <span id="rule"></span><br>
    Regenerated daily at 05:00 local by a launchd agent on the host machine;
    only labels, colours and relative ages are published &mdash; no accounts,
    tokens, paths, or message content. Source:
    <code>connector-dashboard</code>.
  </footer>
</div>

<script>
const SQ = { green: "\u{1F7E9}", red: "\u{1F7E5}" };

function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 172800) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}

function render(data) {
  const g = data.summary.green, r = data.summary.red, t = g + r;
  document.getElementById("updated").textContent =
    "updated " + ago(data.generated);
  document.getElementById("rule").textContent =
    "Rule: green only if refreshed within the last " +
    data.cutoff_hours + " h. Intentionally-off items are dimmed and excluded " +
    "from the score.";

  document.getElementById("score").innerHTML =
    `<span class="pill"><span class="dot green"></span>${g} green</span>` +
    `<span class="pill"><span class="dot red"></span>${r} red</span>` +
    `<span class="pill">${t ? Math.round(100 * g / t) : 0}% healthy</span>`;
  document.querySelector("#bar > span").style.width =
    (t ? 100 * g / t : 0) + "%";

  const root = document.getElementById("groups");
  root.innerHTML = "";
  for (const grp of data.groups) {
    const sec = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.textContent = grp.name;
    sec.appendChild(h2);
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const it of grp.items) {
      const row = document.createElement("div");
      row.className = "row" + (it.intentional ? " intentional" : "");
      row.innerHTML =
        `<span class="sq">${SQ[it.color] || SQ.red}</span>` +
        `<span class="name"></span>` +
        `<span class="note"></span>`;
      row.querySelector(".name").textContent = it.label;
      row.querySelector(".note").textContent = it.note || "";
      grid.appendChild(row);
    }
    sec.appendChild(grid);
    root.appendChild(sec);
  }
}

function sparkline(rows) {
  if (!rows.length) return;
  const box = document.getElementById("spark");
  const svg = document.getElementById("sparksvg");
  const vals = rows.map(r => r.green);
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const span = Math.max(max - min, 1);
  const n = vals.length;
  const pts = vals.map((v, i) => {
    const x = n === 1 ? 300 : (i / (n - 1)) * 300;
    const y = 38 - ((v - min) / span) * 34;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  svg.innerHTML =
    `<polyline fill="none" stroke="var(--green)" stroke-width="2" ` +
    `points="${pts}" />`;
  box.hidden = false;
}

async function load() {
  try {
    const s = await fetch("status.json?_=" + Date.now()).then(r => r.json());
    render(s);
  } catch (e) {
    document.getElementById("groups").innerHTML =
      '<p class="err">Could not load status.json &mdash; ' +
      'the first scheduled run may not have happened yet.</p>';
  }
  try {
    const txt = await fetch("history.jsonl?_=" + Date.now()).then(r => r.text());
    const rows = txt.trim().split("\n").filter(Boolean).map(JSON.parse);
    sparkline(rows.slice(-60));
  } catch (e) { /* history is optional */ }
}

load();
setInterval(load, 30 * 60 * 1000);
</script>
</body>
</html>
