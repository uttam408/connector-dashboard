<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>infra status</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1c1e21; --dim:#8a8f98; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1114; --fg:#e6e8eb; --dim:#767b84; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  main { max-width: 680px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .meta { color: var(--dim); margin: 2px 0 28px; font-size: 12px; }
  h2 {
    font-size: 12px; font-weight: 600; color: var(--dim); margin: 26px 0 8px;
    text-transform: uppercase; letter-spacing: .08em;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 10px; white-space: nowrap; }
  li .h { letter-spacing: 1px; flex: none; }
  li .h i { font-style: normal; }
  li .h i.gap { opacity: .25; }
  li .n { overflow: hidden; text-overflow: ellipsis; }
  li .d { color: var(--dim); margin-left: auto; padding-left: 16px;
          overflow: hidden; text-overflow: ellipsis; }
  li.off { opacity: .4; }
  .err { color: #d1343b; }
  @media (max-width: 560px) { li .h i:nth-child(-n+2) { display: none; } }
  @media (max-width: 430px) { li .h i:nth-child(-n+3) { display: none; } }
</style>
</head>
<body>
<main>
  <h1>infra status</h1>
  <div class="meta" id="meta">loading…</div>
  <div id="body"></div>
</main>
<script>
const REPO = "uttam408/connector-dashboard";
const FRAG_DIR = "status.d";                       // relative to this page
const SQ = { green: "\u{1F7E9}", red: "\u{1F7E5}", gray: "\u{1F4A4}", none: "⬜" };
const WORD = { green: "ok", red: "failed", gray: "skipped" };
const SECTIONS = ["services", "agents"];
const LIST_TTL = 10 * 60 * 1000;                   // re-list the dir this often
const LOOKBACK = 5;

function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 0) return "just now";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 172800) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
function localDay(offsetDays) {
  const d = new Date(Date.now() - offsetDays * 86400000);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
    "-" + String(d.getDate()).padStart(2, "0");
}

// --- fragment discovery -----------------------------------------------------
// Prefer the GitHub API directory listing (fully dynamic). Fall back to the
// union of every label ever seen in history.json if the API is unreachable
// or rate-limited, so the page still renders offline.
async function listFragments(history) {
  try {
    const cached = JSON.parse(sessionStorage.getItem("frag-list") || "null");
    if (cached && Date.now() - cached.t < LIST_TTL) return cached.names;
  } catch (e) { /* ignore */ }
  try {
    const r = await fetch(
      `https://api.github.com/repos/${REPO}/contents/docs/${FRAG_DIR}`,
      { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error(r.status);
    const names = (await r.json())
      .filter(f => f.name.endsWith(".json")).map(f => f.name);
    try { sessionStorage.setItem("frag-list",
      JSON.stringify({ t: Date.now(), names })); } catch (e) { /* ignore */ }
    return names;
  } catch (e) {
    const labels = new Set();
    for (const day of Object.values(history || {}))
      for (const label of Object.keys(day)) labels.add(label);
    return [...labels].map(l =>
      l.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".json");
  }
}

// --- render ---------------------------------------------------------------
let rows = [];                 // [{frag, dEl}] for live "x ago" re-ticking
let history = {};

function noteFor(f) {
  const parts = [];
  if (f.update) parts.push(f.update);
  if (f.ts) parts.push(ago(f.ts));
  if (f.next) parts.push("next " + f.next);
  return parts.join(" | ");
}
function colorFor(f) {
  if (f.stale_hours && f.ts &&
      Date.now() - new Date(f.ts).getTime() > f.stale_hours * 3600000)
    return "red";
  return f.color || "red";
}

function strip(label) {
  let out = "";
  for (let i = LOOKBACK - 1; i >= 0; i--) {
    const c = (history[localDay(i)] || {})[label];
    const when = i === 0 ? "today" : i === 1 ? "yesterday" : i + " days ago";
    out += c
      ? `<i title="${when}: ${WORD[c] || c}">${SQ[c] || SQ.none}</i>`
      : `<i class="gap" title="${when}: no record">${SQ.none}</i>`;
  }
  return out;
}

function tick() {
  for (const { frag, dEl } of rows) if (frag.ts) dEl.textContent = noteFor(frag);
}

function render(frags) {
  const body = document.getElementById("body");
  body.innerHTML = "";
  rows = [];
  let green = 0, red = 0;

  for (const section of SECTIONS) {
    const items = frags.filter(f => (f.section || "agents") === section)
      .sort((a, b) =>
        (!!a.intentional - !!b.intentional) ||
        ((a.order ?? 500) - (b.order ?? 500)) ||
        a.label.localeCompare(b.label));
    if (!items.length) continue;

    const h2 = document.createElement("h2");
    h2.textContent = section;
    const ul = document.createElement("ul");
    for (const f of items) {
      const color = colorFor(f);
      if (!f.intentional) { if (color === "green") green++; else if (color === "red") red++; }
      const li = document.createElement("li");
      if (f.intentional) li.className = "off";
      li.innerHTML = `<span class="h">${strip(f.label)}</span>` +
        `<span class="n"></span><span class="d"></span>`;
      li.querySelector(".n").textContent = f.label;
      const dEl = li.querySelector(".d");
      dEl.textContent = noteFor(f);
      rows.push({ frag: f, dEl });
      ul.appendChild(li);
    }
    body.appendChild(h2);
    body.appendChild(ul);
  }
  document.getElementById("meta").textContent =
    `${green} ok · ${red} failed · refreshed ${ago(new Date().toISOString())}`;
}

async function load() {
  try {
    history = await fetch("history.json?_=" + Date.now()).then(r => r.json());
  } catch (e) { history = {}; }

  const names = await listFragments(history);
  const frags = (await Promise.all(names.map(n =>
    fetch(`${FRAG_DIR}/${n}?_=` + Date.now())
      .then(r => r.ok ? r.json() : null).catch(() => null))))
    .filter(f => f && f.label);

  if (!frags.length) {
    document.getElementById("meta").innerHTML =
      '<span class="err">no status fragments found</span>';
    return;
  }
  render(frags);
}

load();
setInterval(tick, 30 * 1000);
setInterval(load, 2 * 60 * 1000);
</script>
</body>
</html>
