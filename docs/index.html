<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>infra status</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1c1e21; --dim:#8a8f98; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1114; --fg:#e6e8eb; --dim:#767b84; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  main { max-width: 680px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .meta { color: var(--dim); margin: 2px 0 28px; font-size: 12px; }
  h2 {
    font-size: 12px; font-weight: 600; color: var(--dim); margin: 26px 0 8px;
    text-transform: uppercase; letter-spacing: .08em;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 10px; white-space: nowrap; }
  li .h { letter-spacing: 1px; flex: none; }
  li .h i { font-style: normal; }
  li .h i.gap { opacity: .25; }
  li .n { overflow: hidden; text-overflow: ellipsis; }
  li .d { color: var(--dim); margin-left: auto; padding-left: 16px;
          overflow: hidden; text-overflow: ellipsis; }
  li.off { opacity: .4; }
  .err { color: #d1343b; }
  @media (max-width: 560px) { li .h i:nth-child(-n+2) { display: none; } }
  @media (max-width: 430px) { li .h i:nth-child(-n+3) { display: none; } }
</style>
</head>
<body>
<main>
  <h1>infra status</h1>
  <div class="meta" id="meta">loading…</div>
  <div id="body"></div>
</main>
<script>
const REPO = "uttam408/connector-dashboard";
const SQ = { green: "\u{1F7E9}", red: "\u{1F7E5}", gray: "\u{1F4A4}", none: "⬜" };
const WORD = { green: "ok", red: "failed", gray: "skipped" };
const SECTIONS = ["agents", "services"];   // display order
const SECTION_LABEL = { agents: "Agents & Pages", services: "Services" };
const LOOKBACK = 5;
const LIST_TTL = 10 * 60 * 1000;

function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 0) return "just now";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 172800) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
// nextRun mirrors schedule.py's next_run(): "<DAYS> <TIMES>" -> a concrete
// instance ("tonight 11 PM", "tomorrow 6 AM"), recomputed live on every
// render/tick so it never goes stale like a string frozen at report time.
const WD = { MON: 0, TUE: 1, WED: 2, THU: 3, FRI: 4, SAT: 5, SUN: 6 };
function ampm(h, m) {
  const label = `${h % 12 || 12}` + (m ? ":" + String(m).padStart(2, "0") : "");
  return `${label} ${h < 12 ? "AM" : "PM"}`;
}
function nextRun(spec, now) {
  now = now || new Date();
  try {
    const [daysPart, timesPart] = spec.trim().split(/\s+/);
    const weekdays = daysPart.toUpperCase() === "DAILY"
      ? new Set([0, 1, 2, 3, 4, 5, 6])
      : new Set(daysPart.split(",").map(d => WD[d.trim().toUpperCase().slice(0, 3)]));
    const times = timesPart.split(",").map(t => t.trim().split(":").map(Number));
    let best = null;
    for (let d = 0; d <= 7; d++) {
      const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d);
      // JS getDay(): Sun=0..Sat=6; weekdays{} above uses the same Mon..Sun
      // *names* as schedule.py but Python-style 0=Mon indices, so compare
      // via the day-of-week name mapping, not raw getDay().
      const jsToOurs = [6, 0, 1, 2, 3, 4, 5];   // getDay() -> MON=0..SUN=6
      if (!weekdays.has(jsToOurs[day.getDay()])) continue;
      for (const [hh, mm] of times) {
        const cand = new Date(day.getFullYear(), day.getMonth(), day.getDate(), hh, mm, 0, 0);
        if (cand > now && (!best || cand < best)) best = cand;
      }
    }
    if (!best) return null;
    const dayDiff = Math.round(
      (new Date(best.getFullYear(), best.getMonth(), best.getDate()) -
       new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    const prefix = dayDiff === 0 ? (best.getHours() >= 17 ? "tonight" : "today")
      : dayDiff === 1 ? "tomorrow"
      : best.toLocaleDateString("en-US", { weekday: "short" });
    return `${prefix} ${ampm(best.getHours(), best.getMinutes())}`;
  } catch (e) { return null; }
}
function dayOf(iso) {                       // local calendar day of a timestamp
  const d = new Date(iso);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
    "-" + String(d.getDate()).padStart(2, "0");
}
function localDay(offset) {
  return dayOf(new Date(Date.now() - offset * 86400000).toISOString());
}

// --- discovery: GitHub API dir listing, cached; fragments fetched from Pages
async function listFiles() {
  try {
    const c = JSON.parse(sessionStorage.getItem("sd-list") || "null");
    if (c && Date.now() - c.t < LIST_TTL) return c.names;
  } catch (e) { /* ignore */ }
  const r = await fetch(
    `https://api.github.com/repos/${REPO}/contents/docs/status.d`,
    { headers: { Accept: "application/vnd.github+json" } });
  if (!r.ok) throw new Error("list " + r.status);
  const names = (await r.json())
    .filter(f => /\.(jsonl?|json)$/.test(f.name)).map(f => f.name);
  try {
    sessionStorage.setItem("sd-list", JSON.stringify({ t: Date.now(), names }));
  } catch (e) { /* ignore */ }
  return names;
}

// --- parse one status.d file into a row {header, runs[]}
function parseFile(name, text) {
  if (name.endsWith(".jsonl")) {
    const objs = text.trim().split("\n").filter(Boolean).map(l => {
      try { return JSON.parse(l); } catch (e) { return null; }
    }).filter(Boolean);
    const header = objs.find(o => o.label) || { label: name.replace(/\.jsonl$/, "") };
    const runs = objs.filter(o => o.ts);
    return { header, runs };
  }
  // one-shot static .json
  let f; try { f = JSON.parse(text); } catch (e) { return null; }
  if (!f.label) return null;
  return { header: f, runs: f.color ? [{ ts: null, color: f.color,
    update: f.update, next: f.next, static: true }] : [] };
}

// --- one row -> {label, section, order, intentional, color, note, strip, ts}
function resolve(row) {
  const h = row.header;
  const last = row.runs[row.runs.length - 1] || {};
  let color = last.color || "red";
  if (h.stale_hours && last.ts &&
      Date.now() - new Date(last.ts).getTime() > h.stale_hours * 3600000)
    color = "red";

  const byDay = {};                        // last colour recorded per local day
  for (const r of row.runs) if (r.ts) byDay[dayOf(r.ts)] = r.color;
  const strip = [];
  for (let i = LOOKBACK - 1; i >= 0; i--)
    strip.push(byDay[localDay(i)] || (last.static ? color : null));

  const section = h.section || "agents";
  const note = () => {
    const p = [];
    if (last.update && last.update !== "backfill") p.push(last.update);
    // services carry freshness in `update` text; only agents show bare "x ago"
    if (last.ts && section === "agents") p.push(ago(last.ts));
    // schedule (header) is computed live so it can't go stale; next (a run's
    // own field, or a static row's) is a literal, frozen at write time
    const nxt = h.schedule ? nextRun(h.schedule) : (last.next || h.next);
    if (nxt) p.push("next " + nxt);
    return p.join(" | ");
  };

  return {
    label: h.label, section, order: h.order ?? 500,
    intentional: !!h.intentional, color, strip, ts: last.ts, note,
  };
}

let live = [];                             // [{item, dEl}] for "x ago" re-tick
function tick() {
  for (const { item, dEl } of live) if (item.ts) dEl.textContent = item.note();
}

function render(items) {
  const body = document.getElementById("body");
  body.innerHTML = "";
  live = [];
  let green = 0, red = 0;

  for (const section of SECTIONS) {
    const rows = items.filter(it => it.section === section).sort((a, b) =>
      (!!a.intentional - !!b.intentional) || (a.order - b.order) ||
      a.label.localeCompare(b.label));
    if (!rows.length) continue;

    const h2 = document.createElement("h2");
    h2.textContent = SECTION_LABEL[section] || section;
    const ul = document.createElement("ul");
    for (const it of rows) {
      if (!it.intentional) { if (it.color === "green") green++;
        else if (it.color === "red") red++; }
      const strip = it.strip.map((c, n) => {
        const d = it.strip.length - 1 - n;
        const when = d === 0 ? "today" : d === 1 ? "yesterday" : d + " days ago";
        return c
          ? `<i title="${when}: ${WORD[c] || c}">${SQ[c] || SQ.none}</i>`
          : `<i class="gap" title="${when}: no record">${SQ.none}</i>`;
      }).join("");
      const li = document.createElement("li");
      if (it.intentional) li.className = "off";
      li.innerHTML = `<span class="h">${strip}</span>` +
        `<span class="n"></span><span class="d"></span>`;
      li.querySelector(".n").textContent = it.label;
      const dEl = li.querySelector(".d");
      dEl.textContent = it.note();
      live.push({ item: it, dEl });
      ul.appendChild(li);
    }
    body.appendChild(h2);
    body.appendChild(ul);
  }
  document.getElementById("meta").textContent =
    `${green} ok · ${red} failed · refreshed just now`;
}

async function load() {
  let names;
  try { names = await listFiles(); }
  catch (e) {
    document.getElementById("meta").innerHTML =
      '<span class="err">could not list status.d (' + e.message + ')</span>';
    return;
  }
  const items = (await Promise.all(names.map(n =>
    fetch(`status.d/${n}?_=` + Date.now())
      .then(r => r.ok ? r.text() : null)
      .then(t => t && parseFile(n, t)).catch(() => null))))
    .filter(Boolean).map(resolve);

  if (!items.length) {
    document.getElementById("meta").innerHTML =
      '<span class="err">no status files found</span>';
    return;
  }
  render(items);
}

load();
setInterval(tick, 30 * 1000);
setInterval(load, 2 * 60 * 1000);
</script>
</body>
</html>
