<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>infra status</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1c1e21; --dim:#8a8f98; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1114; --fg:#e6e8eb; --dim:#767b84; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  main { max-width: 660px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .meta { color: var(--dim); margin: 2px 0 28px; font-size: 12px; }
  h2 {
    font-size: 12px; font-weight: 600; color: var(--dim); margin: 26px 0 8px;
    text-transform: uppercase; letter-spacing: .08em;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 10px; white-space: nowrap; }
  li .h { letter-spacing: 1px; flex: none; }
  li .h i { font-style: normal; }
  li .h i.gap { opacity: .25; }
  li .n { overflow: hidden; text-overflow: ellipsis; }
  li .d { color: var(--dim); margin-left: auto; padding-left: 16px;
          overflow: hidden; text-overflow: ellipsis; }
  li.off { opacity: .4; }
  .err { color: #d1343b; }
  /* narrow screens: drop the oldest days rather than squashing the label */
  @media (max-width: 560px) { li .h i:nth-child(-n+2) { display: none; } }
  @media (max-width: 430px) { li .h i:nth-child(-n+3) { display: none; } }
</style>
</head>
<body>
<main>
  <h1>infra status</h1>
  <div class="meta" id="meta">loading…</div>
  <div id="body"></div>
</main>
<script>
const SQ = { green: "\u{1F7E9}", red: "\u{1F7E5}", gray: "\u{1F4A4}", none: "⬜" };
const WORD = { green: "ok", red: "failed", gray: "skipped" };
function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 172800) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
let generatedAt = null;
// Items with a `ts` (ISO 8601 run timestamp) and "{ago}" in their note get a
// live relative time, re-rendered on every tick like the header above.
const liveNotes = [];
function liveNote(it) {
  const note = it.note || "";
  return (it.ts && note.includes("{ago}"))
    ? note.replace("{ago}", ago(it.ts))
    : note;
}
function tick() {
  if (generatedAt) document.getElementById("meta").textContent =
    "updated " + ago(generatedAt);
  for (const [it, el] of liveNotes) el.textContent = liveNote(it);
}
async function load() {
  let d;
  try { d = await fetch("status.json?_=" + Date.now()).then(r => r.json()); }
  catch (e) {
    document.getElementById("meta").innerHTML =
      '<span class="err">status.json not available yet</span>';
    return;
  }
  generatedAt = d.generated;
  tick();
  const body = document.getElementById("body");
  body.innerHTML = "";
  liveNotes.length = 0;
  for (const sec of d.sections) {
    const h2 = document.createElement("h2");
    h2.textContent = sec.name;
    const ul = document.createElement("ul");
    for (const it of sec.items) {
      const li = document.createElement("li");
      if (it.intentional) li.className = "off";
      // 7-day strip, oldest -> today. Rightmost square is the current state.
      const hist = it.history || [it.color];
      const strip = hist.map((c, n) => {
        const days = hist.length - 1 - n;
        const when = days === 0 ? "today"
          : days === 1 ? "yesterday" : days + " days ago";
        return c
          ? `<i title="${when}: ${WORD[c] || c}">${SQ[c]}</i>`
          : `<i class="gap" title="${when}: no record">${SQ.none}</i>`;
      }).join("");
      li.innerHTML = `<span class="h">${strip}</span>` +
        `<span class="n"></span><span class="d"></span>`;
      li.querySelector(".n").textContent = it.label;
      const dEl = li.querySelector(".d");
      dEl.textContent = liveNote(it);
      if (it.ts && (it.note || "").includes("{ago}")) liveNotes.push([it, dEl]);
      ul.appendChild(li);
    }
    body.appendChild(h2);
    body.appendChild(ul);
  }
}
load();
setInterval(tick, 30 * 1000);
setInterval(load, 30 * 60 * 1000);
</script>
</body>
</html>
